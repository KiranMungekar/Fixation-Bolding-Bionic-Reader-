version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-1"
    ECR_REPOSITORY: "ecr-my-first-python-app"
    IMAGE_TAG: "latest"
    CONTAINER_NAME: "ecr-my-first-python-app"
  exported-variables:
    - BRANCH_TAG

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - |
        if [ -n "$CODEBUILD_SOURCE_VERSION" ]; then
          export BRANCH_TAG=$(echo $CODEBUILD_SOURCE_VERSION | sed 's|refs/heads/||' | tr '/' '_')
        fi

  build:
    commands:
      - echo Building the Docker image...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY
      - docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
      - docker tag $ECR_REPOSITORY:$IMAGE_TAG $REPO_URI:$IMAGE_TAG
      - docker tag $ECR_REPOSITORY:$IMAGE_TAG $REPO_URI:$COMMIT_HASH
      - |
        if [ -n "$BRANCH_TAG" ]; then
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $REPO_URI:$BRANCH_TAG
        fi

  post_build:
    commands:
      - echo Pushing to ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:$COMMIT_HASH
      - |
        if [ -n "$BRANCH_TAG" ]; then
          echo "Pushing branch tag: $BRANCH_TAG"
          docker push $REPO_URI:$BRANCH_TAG
        else
          echo "No BRANCH_TAG set, skipping branch push."
        fi
      - echo Writing imagedefinitions.json for ECS deployment...
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPO_URI:$COMMIT_HASH" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
